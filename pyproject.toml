[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-approval-gate"
version = "0.1.0"
description = "A human-in-the-loop queue for agent write actions, with a hash-chained SQLite log."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Oğuzhan Balım" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
approval-gate = "approval_gate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/approval_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
